// ==================== FONCTION FILTERED (mise à jour) ====================
function filtered(){
  return D.filter(p=>{
    let mf = FILT==="all" ||
      (FILT==="prod" && (p.pv==="P"||p.pv==="PV")) ||
      (["bio","hve","rare","online","verger","surplace"].includes(FILT) && p.tags.includes(FILT)) ||
      p.co === FILT;
    const ms = !SRH || 
      p.name.toLowerCase().includes(SRH) || 
      p.loc.toLowerCase().includes(SRH) ||
      (CN[p.co]||"").toLowerCase().includes(SRH);
    return mf && ms;
  });
}
