<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Route des Agrumes 🍊 — Carte des pépinières d'agrumes en Europe</title>
<meta name="description" content="La carte interactive des pépinières d'agrumes en France et en Europe : producteurs, greffeurs, variétés rustiques, vente en ligne ou sur place.">
<meta property="og:type" content="website">
<meta property="og:title" content="La Route des Agrumes 🍊">
<meta property="og:description" content="Trouvez une pépinière d'agrumes près de chez vous : plus de 60 adresses en France et en Europe.">
<meta property="og:locale" content="fr_FR">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1419;--bg2:#151c24;--bg3:#1c2530;--card:#131a21;
  --or:#D69E2E;--or2:#E6C068;--tx:#E6EBF0;--tx2:#9AA8B6;--tx3:#66788A;
  --bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.16);
  --FR:#15803D;--IT:#C2410C;--PT:#B91C1C;--ES:#A16207;--CH:#9F1239;--BE:#92400E;--CZ:#3730A3;--BG:#7C2D12;
  --r:10px;--rnd:99px;--sh:0 10px 30px rgba(0,0,0,.5);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}body{height:100vh;height:100dvh}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:var(--safe-t)}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* HEADER */
header{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(135deg,#0b1015,#1c2530 60%,#151c24);border-bottom:1px solid rgba(214,158,46,.3);position:relative;z-index:1001}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand svg{width:34px;height:34px;filter:drop-shadow(0 2px 8px rgba(214,158,46,.5))}
.brand h1{font-family:'Fraunces',serif;font-size:20px;line-height:1.1;color:#fff}
.brand h1 em{font-style:italic;background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;color:var(--tx2);letter-spacing:.4px;margin-top:2px}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 14px 9px 36px;border-radius:var(--rnd);border:1px solid var(--bd2);background:rgba(255,255,255,.06);color:#fff;font:500 13px inherit;outline:none;transition:.15s}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--or);background:rgba(255,255,255,.1)}
.search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7}
.stats{display:flex;gap:6px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--rnd);background:rgba(255,255,255,.07);border:1px solid var(--bd);font-size:11px;color:var(--tx2)}
.chip strong{color:#fff;font-size:13px}
@media(max-width:768px){.brand small,.stats{display:none}.brand h1{font-size:17px}header{gap:10px;padding:8px 12px}}

/* FILTRES */
.fbar{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-bottom:1px solid var(--bd)}
.fbar::-webkit-scrollbar{display:none}
.fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);flex-shrink:0}
.fsep{width:1px;height:20px;background:var(--bd2);margin:0 6px;flex-shrink:0}
.fb{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--rnd);border:1px solid var(--bd2);background:transparent;color:var(--tx2);font-size:12px;font-weight:600;white-space:nowrap;transition:.15s}
.fb:hover{border-color:var(--or);color:#fff}
.fb.on{background:var(--or);border-color:var(--or);color:#fff;box-shadow:0 2px 10px rgba(214,158,46,.35)}
.fb .fi{width:16px;height:12px;border-radius:2px}
.fb .n{font-size:10px;opacity:.7}
.reset{margin-left:auto;color:var(--or);border-color:transparent;display:none}
.reset.show{display:inline-flex}

/* LAYOUT */
.main{flex:1;display:flex;min-height:0;position:relative}
#map{flex:1;background:var(--bg)}
.leaflet-control-zoom a{background:var(--bg3)!important;color:#fff!important;border-color:var(--bd2)!important}
.leaflet-control-attribution{background:rgba(15,20,25,.85)!important;color:var(--tx3)!important;font-size:9px!important}
.leaflet-control-attribution a{color:var(--tx2)!important}

/* MARQUEURS */
.mk{display:flex;flex-direction:column;align-items:center;transition:transform .15s}
.mk:hover{transform:scale(1.15)}
.mk-h{border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.55);width:26px;height:26px}
.mk-h .fi{display:block;width:32px;height:26px;margin-left:-3px;background-size:cover}
.mk-t{width:0;height:0;border:5px solid transparent;border-bottom:0;border-top-width:7px;margin-top:-1px}
.mk.sel .mk-h{width:38px;height:38px;border-width:3px}
.mk.sel .mk-h .fi{width:46px;height:38px;margin-left:-4px}
.mk.sel .mk-t{border-width:7px;border-bottom:0;border-top-width:10px}
.mk.bio .mk-h{box-shadow:0 0 0 3px #22C55E,0 3px 10px rgba(0,0,0,.5)}
.mk.hve .mk-h{box-shadow:0 0 0 3px #EAB308,0 3px 10px rgba(0,0,0,.5)}
.mk.rare .mk-h{box-shadow:0 0 0 3px var(--or),0 3px 10px rgba(0,0,0,.5)}
.marker-cluster div{background:linear-gradient(135deg,var(--or),#9A6B14)!important;color:#fff!important;font:700 13px 'Plus Jakarta Sans',sans-serif!important;border:2px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.5)}
.marker-cluster{background:rgba(214,158,46,.3)!important}
.leaflet-tooltip.pep-tip{background:rgba(15,20,25,.95);border:1px solid rgba(214,158,46,.5);border-radius:8px;color:#fff;padding:6px 10px;box-shadow:var(--sh);font:600 12px 'Plus Jakarta Sans',sans-serif}
.leaflet-tooltip.pep-tip::before{display:none}
.pep-tip small{display:block;color:var(--tx2);font-weight:500;font-size:10px;margin-top:1px}
.leaflet-tooltip.reg-tip{background:rgba(15,20,25,.9);border:1px solid rgba(214,158,46,.35);color:#E6C068;font:700 10px 'Plus Jakarta Sans',sans-serif;border-radius:4px}
.leaflet-tooltip.reg-tip::before{display:none}

/* SIDEBAR */
.sidebar{width:330px;flex-shrink:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#121920,#0c1116);border-left:1px solid rgba(214,158,46,.2);z-index:400}
.sb-hd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bd)}
.sb-hd h2{font:700 15px 'Fraunces',serif;color:#fff}
.sb-hd p{font-size:10px;color:var(--tx2);margin-top:2px}
.sb-x{display:none;margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd2);background:transparent;color:var(--tx2)}
.lw{flex:1;overflow-y:auto;min-height:0}
.lw::-webkit-scrollbar{width:4px}.lw::-webkit-scrollbar-thumb{background:#2d3a48;border-radius:2px}
.ch{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(12,17,22,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2)}
.ch .fi{width:18px;height:13px;border-radius:2px}
.ch span:last-child{margin-left:auto;background:rgba(214,158,46,.15);color:var(--or);border-radius:var(--rnd);padding:1px 8px}
.it{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;border-left:3px solid transparent;transition:.12s}
.it:hover{background:rgba(214,158,46,.08)}
.it.active{background:rgba(214,158,46,.15);border-left-color:var(--or)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.it-n{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-l{font-size:10.5px;color:var(--tx2);margin:2px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:var(--rnd);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.t-prod{background:rgba(34,197,94,.18);color:#4ADE80}.t-rev{background:rgba(251,146,60,.18);color:#E6C068}.t-pv{background:rgba(96,165,250,.18);color:#93C5FD}
.t-bio{background:rgba(34,197,94,.2);color:#86EFAC}.t-bioconv{background:rgba(34,197,94,.1);color:#A7F3D0;border:1px solid rgba(34,197,94,.25)}
.t-hve{background:rgba(234,179,8,.2);color:#FDE047}.t-rare{background:rgba(214,158,46,.2);color:#E6C068}
.t-online{background:rgba(14,165,233,.2);color:#7DD3FC}.t-local{background:rgba(139,92,246,.2);color:#C4B5FD}
.t-verger{background:rgba(244,63,94,.2);color:#FDA4AF}.t-new{background:rgba(230,192,104,.2);color:#FDE047}
.empty{padding:50px 20px;text-align:center;color:var(--tx2);font-size:13px}
.empty span{display:block;font-size:30px;margin-bottom:8px}

.mob-btn{display:none;position:absolute;right:14px;bottom:calc(22px + var(--safe-b));z-index:600;padding:11px 18px;border-radius:var(--rnd);border:0;background:linear-gradient(135deg,var(--or),#9A6B14);color:#fff;font-weight:700;font-size:13px;box-shadow:var(--sh)}
@media(max-width:768px){
  .mob-btn{display:block}
  .sidebar{position:absolute;inset:auto 0 0 0;width:100%;height:72%;border-left:0;border-top:1px solid rgba(214,158,46,.35);border-radius:18px 18px 0 0;z-index:700;transform:translateY(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.6);padding-bottom:var(--safe-b)}
  .sidebar.open{transform:none}
  .sb-x{display:block}
  .sb-hd{position:relative;padding-top:18px}
  .sb-hd::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:rgba(255,255,255,.22)}
}
@media(min-width:769px) and (max-width:1100px){.sidebar{width:280px}.stats{display:none}.search{max-width:300px}}

/* MODALE */
.ov{display:none;position:fixed;inset:0;z-index:2000;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,11,.75);backdrop-filter:blur(8px)}
.ov.open{display:flex}
.modal{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--card);border:1px solid rgba(214,158,46,.25);border-radius:16px;box-shadow:var(--sh);animation:pop .22s cubic-bezier(.34,1.3,.64,1)}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@media(max-width:600px){.ov{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0;max-height:90vh;animation:up .28s ease;padding-bottom:var(--safe-b)}}
.mh{position:relative;padding:20px 22px 16px;background:linear-gradient(135deg,#1c2530,#27333f);border-bottom:1px solid rgba(214,158,46,.2)}
.m-c{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:11px;font-weight:700;color:var(--tx2)}
.m-c .fi{width:28px;height:21px;border-radius:3px}
.m-n{font:700 22px/1.2 'Fraunces',serif;color:#fff;padding-right:34px}
.m-l{font-size:12px;color:var(--tx2);margin-top:4px}
.m-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--bd2);background:rgba(255,255,255,.08);color:#fff}
.mb{padding:16px 22px 22px}
.mb .tags{margin-bottom:14px}
.mb .tag{font-size:10px;padding:3px 10px}
.m-d{font-size:13px;line-height:1.75;color:var(--tx);padding:12px 14px;margin-bottom:14px;background:rgba(214,158,46,.06);border-left:3px solid var(--or);border-radius:0 var(--r) var(--r) 0}
.cert{margin-bottom:14px;padding:11px 14px;font-size:12px;line-height:1.6;color:var(--tx2);background:rgba(255,255,255,.04);border-left:3px solid var(--or2);border-radius:0 var(--r) var(--r) 0}
.cert strong{color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.cell{padding:9px 11px;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:8px}
.cell .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700;margin-bottom:3px}
.cell .v{font-size:12px;font-weight:600;color:#fff}
.ct{padding:10px 14px;margin-bottom:14px;font-size:12.5px;line-height:2;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:8px}
.ct a{color:#7DD3FC;text-decoration:none}.ct a:hover{text-decoration:underline}
.btns{display:flex;gap:8px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;border-radius:var(--r);border:1px solid var(--bd2);background:rgba(255,255,255,.07);color:#fff;font-weight:700;font-size:13px;text-decoration:none;transition:.15s}
.btn.main{background:linear-gradient(135deg,var(--or),#9A6B14);border:0;box-shadow:0 4px 18px rgba(214,158,46,.3)}
.btn:hover{transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);z-index:3000;padding:9px 16px;border-radius:var(--rnd);background:#2a2112;border:1px solid var(--or);color:#E6C068;font-size:12px;display:none}

/* Finitions : header lumineux, sélection animée, tactile, accessibilité */
header::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 0,rgba(214,158,46,.38),transparent 45%),radial-gradient(circle at 88% 100%,rgba(230,192,104,.2),transparent 42%)}
header>*{position:relative;z-index:1}
.mk.sel{animation:drop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes drop{from{transform:translateY(-16px);opacity:.3}}
.geo{margin-left:auto;border-color:rgba(6,182,212,.5);color:#67E8F9}
.geo+.reset.show{margin-left:0}
@media(pointer:coarse){.fb{padding:10px 16px}.it{padding:14px}.m-x,.sb-x{width:40px;height:40px}.btn{padding:15px}.leaflet-bar a{width:38px!important;height:38px!important;line-height:38px!important}}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{id:61,co:"CH",fc:"ch",pv:"P",name:"AlpAgrumi",loc:"Via Alla Riviera 24, 6512 Giubiasco (Bellinzona)",lat:46.182,lon:9.0128,tags:["rare","online"],spec:"Tessin. Livraison maison avec leur propre service pour éviter tout dommage. Yuzu, agrumes rares. Fiches conseils très détaillées.",site:"https://alpagrumi.ch/",tel:"+41 76 247 36 26",note:"5.0/5",vente:"Livraison maison"},
{id:62,co:"CH",fc:"ch",pv:"P",name:"Eisenhut Vivaio",loc:"Via Piaggia 14, 6575 San Nazzaro (Gambarogno)",lat:46.1105,lon:8.8225,tags:["rare","online"],spec:"Tessin. Jardin botanique + pépinière au bord du lac Majeur. Magnolias, camélias, agrumes rustiques. Vue exceptionnelle.",site:"https://eisenhut.ch/fr/",tel:"+41 91 795 18 67",note:"4.5/5",vente:"Sur place + en ligne"}
];

</script>
<script>
"use strict";
if(typeof D==="undefined"){document.body.innerHTML='<p style="padding:30px;color:#fff;font:16px sans-serif">Les fiches sont absentes : colle ton bloc <code>const D=[…];</code> à l\u2019emplacement « DONNÉES » de index.html.</p>';throw new Error("D manquant");}
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mob=()=>innerWidth<=768;

const CC={FR:"#15803D",IT:"#C2410C",PT:"#B91C1C",ES:"#A16207",CH:"#9F1239",BE:"#92400E",CZ:"#3730A3",BG:"#7C2D12"};
const CN={FR:"France",IT:"Italie",PT:"Portugal",ES:"Espagne",CH:"Suisse",BE:"Belgique",CZ:"Tchéquie",BG:"Bulgarie"};
const ORDER=["FR","BE","BG","IT","PT","ES","CZ","CH"];
const TAGS={
  bio:{c:"t-bio",l:"🌱 Bio AB"},bioconv:{c:"t-bioconv",l:"🌿 Bio"},hve:{c:"t-hve",l:"🏅 HVE"},
  rare:{c:"t-rare",l:"⭐ Rares"},online:{c:"t-online",l:"🌐 En ligne"},local:{c:"t-local",l:"📍 Local"},verger:{c:"t-verger",l:"🌳 Verger"}
};
const CERTS={
  bio:"<strong>Agriculture Biologique AB</strong> — production certifiée sans pesticides ni engrais de synthèse, contrôlée par un organisme agréé.",
  hve:"<strong>Haute Valeur Environnementale</strong> — certification agro-environnementale française (biodiversité, fertilisation, eau). Distincte du Bio AB."
};
const PV={P:["t-prod","Producteur"],PV:["t-pv","Prod. & Rev."],V:["t-rev","Revendeur"]};

/* ── ÉTAT DES FILTRES ── */
const S={co:"all",types:new Set(),liv:null,q:"",sel:null};
const TYPES=[["prod","🌿 Producteur",p=>p.pv!=="V"],["bio","🌱 Bio",p=>p.tags.includes("bio")||p.tags.includes("bioconv")],
  ["hve","🏅 HVE",p=>p.tags.includes("hve")],["rare","⭐ Rares",p=>p.tags.includes("rare")]];
const LIVS=[["envoi","📦 Envoi possible",p=>p.tags.includes("online")],["place","🏡 Sur place seulement",p=>!p.tags.includes("online")]];
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

function matches(p,skipCo){
  if(!skipCo&&S.co!=="all"&&p.co!==S.co)return false;
  for(const k of S.types)if(!TYPES.find(t=>t[0]===k)[2](p))return false;
  if(S.liv&&!LIVS.find(t=>t[0]===S.liv)[2](p))return false;
  if(S.q&&!norm(p.name+" "+p.loc+" "+(CN[p.co]||"")+" "+p.spec).includes(S.q))return false;
  return true;
}

/* ── BARRE DE FILTRES ── */
function buildBar(){
  const cos=ORDER.filter(c=>D.some(p=>p.co===c));
  let h=`<span class="fl">Pays</span><button class="fb" data-k="co" data-v="all">🌍 Tous</button>`;
  cos.forEach(c=>h+=`<button class="fb" data-k="co" data-v="${c}"><span class="fi fi-${c.toLowerCase()}"></span>${CN[c]} <span class="n" data-n="${c}"></span></button>`);
  h+=`<div class="fsep"></div><span class="fl">Type</span>`;
  TYPES.forEach(t=>h+=`<button class="fb" data-k="type" data-v="${t[0]}">${t[1]}</button>`);
  h+=`<div class="fsep"></div><span class="fl">Livraison</span>`;
  LIVS.forEach(t=>h+=`<button class="fb" data-k="liv" data-v="${t[0]}">${t[1]}</button>`);
  h+=`<button class="fb geo" id="geo">📍 Près de moi</button><button class="fb reset" id="reset">↺ Réinitialiser</button>`;
  $("fbar").innerHTML=h;
  $("fbar").addEventListener("click",e=>{
    const b=e.target.closest(".fb");if(!b)return;
    if(b.id==="geo"){locate();return;}
    if(b.id==="reset"){S.co="all";S.types.clear();S.liv=null;S.q="";$("q").value="";}
    else{
      const{k,v}=b.dataset;
      if(k==="co")S.co=v;
      else if(k==="type")S.types.has(v)?S.types.delete(v):S.types.add(v);
      else S.liv=S.liv===v?null:v;
    }
    render();
  });
}

/* ── CARTE ── */
const map=L.map("map",{center:[46.5,7],zoom:5,zoomControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">Contributeurs OpenStreetMap</a>',subdomains:"abc",maxZoom:19
}).addTo(map);
const cluster=L.markerClusterGroup({maxClusterRadius:38,showCoverageOnHover:false,disableClusteringAtZoom:11,spiderfyOnMaxZoom:true});
map.addLayer(cluster);

function icon(p,sel){
  const ring=p.tags.includes("bio")?"bio":p.tags.includes("hve")?"hve":p.tags.includes("rare")?"rare":"";
  const h=sel?48:35;
  return L.divIcon({className:"",iconSize:[sel?38:26,h],iconAnchor:[sel?19:13,h],
    html:`<div class="mk${sel?" sel":""} ${ring}"><div class="mk-h"><span class="fi fi-${esc(p.fc)}"></span></div><div class="mk-t" style="border-top-color:${CC[p.co]||"#444"}"></div></div>`});
}
const MK={};
D.forEach(p=>{
  const m=L.marker([p.lat,p.lon],{icon:icon(p,false),title:p.name});
  m.bindTooltip(`${esc(p.name)}<small>${esc(p.loc.split(",").slice(-1)[0].trim())}</small>`,{direction:"top",className:"pep-tip",offset:[0,-30]});
  m.on("click",()=>openMod(p.id));
  MK[p.id]=m;
});

/* Frontières + régions (échec silencieux avec message discret) */
const EU=new Set([8,20,40,56,70,100,191,203,208,233,246,250,276,300,348,352,372,380,428,438,440,442,470,492,498,499,528,578,616,620,642,643,674,688,703,705,724,752,756,804,807,826]);
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json()),
  fetch("https://cdn.jsdelivr.net/gh/gregoiredavid/france-geojson@master/regions-version-simplifiee.geojson").then(r=>r.json())
]).then(([w,reg])=>{
  const all=topojson.feature(w,w.objects.countries);
  L.geoJSON({type:"FeatureCollection",features:all.features.filter(f=>EU.has(+f.id))},
    {style:{color:"#A0C8FF",weight:1,opacity:.5,fillOpacity:0,interactive:false},pane:"tilePane"}).addTo(map);
  L.geoJSON(reg,{style:{color:"#D69E2E",weight:1.8,opacity:.75,dashArray:"7,5",fillColor:"#D69E2E",fillOpacity:.04},
    onEachFeature:(f,l)=>{const n=f.properties.nom;if(n)l.bindTooltip(n,{sticky:true,className:"reg-tip"});}}).addTo(map);
}).catch(()=>{const t=$("toast");t.textContent="Les frontières n'ont pas pu être chargées.";t.style.display="block";setTimeout(()=>t.style.display="none",4000);});

/* ── RENDU ── */
function render(){
  const f=D.filter(p=>matches(p));
  const ids=new Set(f.map(p=>p.id));
  cluster.clearLayers();
  cluster.addLayers(D.filter(p=>ids.has(p.id)).map(p=>MK[p.id]));

  const nFR=f.filter(p=>p.co==="FR").length;
  $("cnt-fr").textContent=nFR;$("cnt-eu").textContent=f.length-nFR;
  $("mob-cnt").textContent=f.length;
  $("sb-cnt").textContent=`${f.length} établissement${f.length>1?"s":""} · ${new Set(f.map(p=>p.co)).size} pays`;

  document.querySelectorAll("#fbar .fb[data-k]").forEach(b=>{
    const{k,v}=b.dataset;
    b.classList.toggle("on",k==="co"?S.co===v:k==="type"?S.types.has(v):S.liv===v);
  });
  document.querySelectorAll("#fbar [data-n]").forEach(n=>n.textContent=D.filter(p=>p.co===n.dataset.n&&matches(p,true)).length);
  $("reset").classList.toggle("show",S.co!=="all"||S.types.size>0||!!S.liv||!!S.q);

  const by={};f.forEach(p=>(by[p.co]=by[p.co]||[]).push(p));
  let h="";
  ORDER.forEach(co=>{
    if(!by[co])return;
    h+=`<div class="ch"><span class="fi fi-${co.toLowerCase()}"></span><span>${CN[co]}</span><span>${by[co].length}</span></div>`;
    by[co].forEach(p=>{
      const tg=p.tags.map(t=>TAGS[t]?`<span class="tag ${TAGS[t].c}">${TAGS[t].l}</span>`:"").join("");
      h+=`<div class="it${S.sel===p.id?" active":""}" id="li-${p.id}" data-id="${p.id}">
        <span class="dot" style="background:${CC[p.co]||"#444"}"></span>
        <div style="min-width:0"><div class="it-n">${esc(p.name)}</div>
        <div class="it-l">📍 ${esc(p.loc.split(",").slice(-2).join(",").trim())}</div>
        <div class="tags"><span class="tag ${PV[p.pv][0]}">${PV[p.pv][1]}</span>${tg}${p.isNew?'<span class="tag t-new">✨ Nouveau</span>':""}</div></div></div>`;
    });
  });
  $("lw").innerHTML=h||`<div class="empty"><span>🔍</span>Aucune pépinière ne correspond.</div>`;
}
$("lw").addEventListener("click",e=>{const it=e.target.closest(".it");if(it)openMod(+it.dataset.id);});

/* ── MODALE ── */
function openMod(id){
  const p=D.find(x=>x.id===id);if(!p)return;
  if(S.sel&&MK[S.sel])MK[S.sel].setIcon(icon(D.find(x=>x.id===S.sel),false));
  S.sel=id;MK[id].setIcon(icon(p,true));
  $("m-fi").className="fi fi-"+p.fc;
  $("m-co").textContent=CN[p.co]||p.co;
  $("m-n").textContent=p.name;
  $("m-l").textContent="📍 "+p.loc;
  const st=[`<span class="tag ${PV[p.pv][0]}">${PV[p.pv][1]}</span>`]
    .concat(p.tags.map(t=>TAGS[t]?`<span class="tag ${TAGS[t].c}">${TAGS[t].l}</span>`:""));
  if(p.isNew)st.push('<span class="tag t-new">✨ Nouveau</span>');
  $("m-tags").innerHTML=st.join("");
  const ce=(p.certifs||[]).filter(c=>CERTS[c]).map(c=>`<div>${CERTS[c]}</div>`).join("");
  $("m-cert").hidden=!ce;$("m-cert").innerHTML=ce;
  $("m-d").textContent=p.spec;
  $("m-grid").innerHTML=[["Note clients",p.note],["Vente",p.vente],["Pays",CN[p.co]]]
    .map(([l,v])=>`<div class="cell"><div class="l">${l}</div><div class="v">${esc(v||"—")}</div></div>`).join("");
  const ln=[];
  if(p.tel)ln.push(`📞 <a href="tel:${esc(p.tel.replace(/[^+\d]/g,""))}">${esc(p.tel)}</a>`);
  if(p.email)ln.push(`✉️ <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`);
  $("m-ct").hidden=!ln.length;$("m-ct").innerHTML=ln.join("<br>");
  const s=$("m-site");s.hidden=!p.site;if(p.site)s.href=p.site;
  $("ov").classList.add("open");
  history.replaceState(null,"","#"+id);
  document.querySelectorAll(".it").forEach(e=>e.classList.toggle("active",e.id==="li-"+id));
  const el=$("li-"+id);if(el)el.scrollIntoView({block:"nearest"});
  if(mob())$("sidebar").classList.remove("open");
}
function closeMod(){
  $("ov").classList.remove("open");
  if(S.sel){MK[S.sel].setIcon(icon(D.find(x=>x.id===S.sel),false));S.sel=null;}
  history.replaceState(null,"",location.pathname+location.search);
  document.querySelectorAll(".it.active").forEach(e=>e.classList.remove("active"));
}
$("m-x").onclick=closeMod;
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeMod();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMod();});
$("m-zoom").onclick=()=>{
  const p=D.find(x=>x.id===S.sel);if(!p)return;
  $("ov").classList.remove("open");
  map.setView([p.lat,p.lon],13,{animate:true});
};

/* ── DIVERS ── */
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",4000);}
let me;
function locate(){
  if(!navigator.geolocation)return toast("Géolocalisation indisponible sur cet appareil.");
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(me)me.remove();
    me=L.circleMarker(ll,{radius:8,color:"#fff",weight:3,fillColor:"#06B6D4",fillOpacity:1}).addTo(map);
    map.setView(ll,8,{animate:true});
  },()=>toast("Localisation refusée ou indisponible."),{timeout:8000});
}
$("mob-btn").onclick=()=>$("sidebar").classList.add("open");
$("sb-x").onclick=()=>$("sidebar").classList.remove("open");
map.on("click",()=>{if(mob())$("sidebar").classList.remove("open");});
let t;$("q").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{S.q=norm(e.target.value.trim());render();},150);});

buildBar();render();
const h0=+location.hash.slice(1);
if(h0&&D.some(p=>p.id===h0)){const p=D.find(x=>x.id===h0);map.setView([p.lat,p.lon],10);openMod(h0);}
</script>
