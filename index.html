<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍋 La Route des Agrumes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nv:  #0D1B2A; --nv2: #122030; --nv3: #182C42; --nv4: #1F3A58; --nv5: #2A4D72;
  --gold:#F0B429; --sea:#29B6D8; --sea2:#1A8EAA; --sea3:#0F6070;
  --w:#FFFFFF; --tx:#C8DDED; --tx2:#7AAAC8; --tx3:#3D6482;
  --bd: rgba(255,255,255,.07); --bd2:rgba(255,255,255,.14); --bd3:rgba(255,255,255,.22);
  --FR:#16844E; --IT:#D04A18; --PT:#C02020; --CH:#982020; --BE:#C07C08; --CZ:#5040B0; --BG:#A02828;
  --s0:0 2px 10px rgba(0,0,0,.3); --s1:0 8px 28px rgba(0,0,0,.48); --s2:0 20px 60px rgba(0,0,0,.62);
  --r6:6px; --r10:10px; --r14:14px; --r99:99px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--nv);color:var(--tx);display:flex;flex-direction:column;}

/* HEADER, FILTER BAR, etc. (inchangé) */
header{
  flex-shrink:0;height:54px;
  background:linear-gradient(135deg,var(--nv),var(--nv3));
  border-bottom:1px solid var(--bd2);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  z-index:1001;box-shadow:0 2px 18px rgba(0,0,0,.4);
}
.logo{
  font-family:'Playfair Display',serif;font-size:17px;font-weight:700;
  color:var(--w);display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
}
.logo em{color:var(--gold);font-style:italic;}
.logo-n{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;
  color:var(--gold);background:rgba(240,180,41,.12);
  border:1px solid rgba(240,180,41,.28);border-radius:var(--r99);padding:2px 9px;white-space:nowrap;
}
.sw{flex:1;position:relative;max-width:280px;}
.sw input{
  width:100%;background:rgba(255,255,255,.09);border:1px solid var(--bd2);
  border-radius:var(--r10);color:var(--w);padding:7px 12px 7px 32px;
  font-family:'Inter',sans-serif;font-size:12px;outline:none;transition:all .2s;
}
.sw input::placeholder{color:rgba(255,255,255,.28);}
.sw input:focus{background:rgba(255,255,255,.14);border-color:var(--sea);}
.sw-i{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.35;font-size:13px;pointer-events:none;}
.hst{margin-left:auto;display:flex;gap:5px;flex-shrink:0;}
.hchip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:var(--r99);padding:3px 9px;font-size:10px;color:var(--tx2);}
.hchip strong{font-size:12px;font-weight:700;}
.hchip.cfr strong{color:#3DD880;}
.hchip.ceu strong{color:var(--gold);}

/* ... (le reste du CSS est identique à ton code original) ... */
@media(max-width:640px){.hchip{display:none;}.logo-n{display:none;}}
.fbar, .main, #map, .fcnt, .legend, .mob-list-btn, .sidebar, .ov, .modal { /* tous tes styles originaux */ }
</style>
</head>
<body>

<!-- Ton HTML (header, filtres, map, sidebar, modal) reste EXACTEMENT le même -->
<header>
  <div class="logo">🍋 La Route des <em>Agrumes</em></div>
  <span class="logo-n" id="main-badge">61 pépinières</span>
  <div class="sw">
    <span class="sw-i">🔍</span>
    <input type="text" id="search" placeholder="Rechercher…" oninput="doSearch(this.value)">
  </div>
  <div class="hst">
    <div class="hchip cfr">🇫🇷 <strong id="cnt-fr">47</strong></div>
    <div class="hchip ceu">🌍 <strong id="cnt-eu">14</strong></div>
  </div>
</header>

<div class="fbar">
  <span class="fl">Pays:</span>
  <button class="fb on" data-f="all" onclick="setF('all',this)">🌍 Tous</button>
  <button class="fb" data-f="FR" onclick="setF('FR',this)">🇫🇷 France</button>
  <button class="fb" data-f="IT" onclick="setF('IT',this)">🇮🇹 Italie</button>
  <button class="fb" data-f="PT" onclick="setF('PT',this)">🇵🇹 Portugal</button>
  <button class="fb" data-f="CH" onclick="setF('CH',this)">🇨🇭 Suisse</button>
  <button class="fb" data-f="BE" onclick="setF('BE',this)">🇧🇪 Belgique</button>
  <button class="fb" data-f="CZ" onclick="setF('CZ',this)">🇨🇿 Tchéquie</button>
  <button class="fb" data-f="BG" onclick="setF('BG',this)">🇧🇬 Bulgarie</button>
  <div class="sv"></div>
  <span class="fl">Type:</span>
  <button class="fb" data-f="prod" onclick="setF('prod',this)">🌿 Producteur</button>
  <button class="fb" data-f="bio" onclick="setF('bio',this)">🌱 Bio</button>
  <button class="fb" data-f="rare" onclick="setF('rare',this)">⭐ Rares</button>
</div>

<div class="main">
  <div id="map"></div>

  <div class="fcnt" id="fcnt">61 pépinières</div>
  <div class="legend"> <!-- légende identique --> </div>
  <div class="mob-list-btn" id="mob-btn" onclick="openSidebar()">📋 <span id="mob-cnt">61 pépinières</span></div>

  <div class="sidebar" id="sidebar">
    <!-- sidebar identique -->
  </div>
</div>

<!-- MODAL identique -->
<div class="ov" id="ov" onclick="closeOv(event)">
  <!-- ... ton modal complet ... -->
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ==================== DONNÉES (inchangées) ==================== */
const D = [ /* ... toutes tes 61 pépinières ... */ ];

// ==================== CONFIG ====================
const CC = {FR:"#16844E",IT:"#D04A18",PT:"#C02020",CH:"#982020",BE:"#C07C08",CZ:"#5040B0",BG:"#A02828"};
const CN = {FR:"🇫🇷 France",IT:"🇮🇹 Italie",PT:"🇵🇹 Portugal",CH:"🇨🇭 Suisse",BE:"🇧🇪 Belgique",CZ:"🇨🇿 Rép. Tchèque",BG:"🇧🇬 Bulgarie"};
const CO = ["FR","BE","BG","IT","PT","CZ","CH"];
const PVL = {P:"🌿 Producteur / Greffeur",V:"🏪 Revendeur",PV:"🌿🏪 Producteur & Revendeur"};

const col = p => CC[p.co] || "#555";
const isMobile = () => window.innerWidth <= 768;

// ==================== ICÔNE AMÉLIORÉE (DRAPEAUX VISIBLES SUR PC) ====================
function mkIcon(p, big = false) {
  const c = col(p);
  const s = big ? 46 : 30;
  const flagSize = big ? 20 : 14;

  return L.divIcon({
    className: "",
    html: `
      <div style="width:${s}px;height:${s}px;background:${c};border-radius:50% 50% 50% 0;transform:rotate(-45deg);
                  box-shadow:0 3px 14px rgba(0,0,0,.5), 0 0 0 ${big?3:2}px rgba(255,255,255,${big?0.6:0.35});
                  display:flex;align-items:center;justify-content:center;">
        <img src="https://flagcdn.com/w40/${p.co.toLowerCase()}.png" 
             style="width:${flagSize}px;height:${flagSize}px;transform:rotate(45deg);filter:drop-shadow(0 1px 3px rgba(0,0,0,0.5));object-fit:contain;">
      </div>`,
    iconSize: [s, s],
    iconAnchor: [s/2, s],
    popupAnchor: [0, -s]
  });
}

/* ==================== MAP ==================== */
const map = L.map("map", {center: [47, 8], zoom: 5, zoomControl: true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: "abcd",
  maxZoom: 19
}).addTo(map);

const MK = {};
let FILT = "all", SRH = "", SEL = null;

D.forEach(p => {
  const m = L.marker([p.lat, p.lon], {icon: mkIcon(p)}).addTo(map);
  m.on("click", () => { openMod(p.id); if(isMobile()) closeSidebar(); });
  MK[p.id] = m;
});

/* ==================== Le reste du code (render, modal, filtres...) ==================== */
// Copie-colle tout le reste de ton script original ici (filtered, render, openMod, etc.)

function filtered(){
  return D.filter(p=>{
    const mf=FILT==="all"||p.co===FILT||p.tags.includes(FILT)||
              (FILT==="prod"&&(p.pv==="P"||p.pv==="PV"));
    const ms=!SRH||
      p.name.toLowerCase().includes(SRH)||
      p.loc.toLowerCase().includes(SRH)||
      (CN[p.co]||"").toLowerCase().includes(SRH);
    return mf&&ms;
  });
}

function render(){
  const f=filtered(), ids=new Set(f.map(p=>p.id));
  const n=f.length;
  document.getElementById("main-badge").textContent=n+" pépinières";
  document.getElementById("fcnt").textContent=n+" pépinières affichées";
  document.getElementById("mob-cnt").textContent=n+" pépinières";
  document.getElementById("sb-count").textContent=n+" établissements · 7 pays";
  document.getElementById("cnt-fr").textContent=f.filter(p=>p.co==="FR").length;
  document.getElementById("cnt-eu").textContent=f.filter(p=>p.co!=="FR").length;

  D.forEach(p=>{ ids.has(p.id) ? (!map.hasLayer(MK[p.id]) && MK[p.id].addTo(map)) : map.removeLayer(MK[p.id]); });

  // ... (le reste de ta fonction render reste identique)
  const byC={};
  f.forEach(p=>{(byC[p.co]=byC[p.co]||[]).push(p);});
  let h="";
  CO.forEach(co=>{
    if(!byC[co])return;
    h+=`<div class="ch"><span class="ch-f">${byC[co][0].fl}</span><span class="ch-n">${CN[co]||co}</span><span class="ch-c">${byC[co].length}</span></div>`;
    byC[co].forEach(p=>{
      const c=col(p);
      const pvCls=p.pv==="P"?"tp":p.pv==="PV"?"tp":"tv";
      const pvLbl=p.pv==="P"?"Producteur":p.pv==="PV"?"Prod. & Revendeur":"Revendeur";
      const tgs=p.tags.map(t=>`<span class="tag ${TC[t]||""}">${TL[t]||t}</span>`).join("");
      h+=`<div class="it${SEL===p.id?" active":""}" id="li-${p.id}" onclick="openMod(${p.id})">
        <span class="it-dot" style="background:${c}"></span>
        <div class="it-b">
          <div class="it-n">${p.name}</div>
          <div class="it-l">📍 ${p.loc.split(",")[0]}</div>
          <div class="it-t"><span class="tag ${pvCls}">${pvLbl}</span>${tgs}</div>
        </div>
      </div>`;
    });
  });
  document.getElementById("lw").innerHTML=h||`<div class="nr"><span>🔍</span>Aucun résultat</div>`;
}

// openMod, closeMod, setF, etc. (copie le reste de ton script original)

render();
</script>
</body>
</html>
