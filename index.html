<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍋 La Route des Agrumes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nv:  #0D1B2A; --nv2: #122030; --nv3: #182C42; --nv4: #1F3A58; --nv5: #2A4D72;
  --gold:#F0B429; --sea:#29B6D8; --sea2:#1A8EAA; --sea3:#0F6070;
  --w:#FFFFFF; --tx:#C8DDED; --tx2:#7AAAC8; --tx3:#3D6482;
  --bd: rgba(255,255,255,.07); --bd2:rgba(255,255,255,.14); --bd3:rgba(255,255,255,.22);
  --FR:#16844E; --IT:#D04A18; --PT:#C02020; --CH:#982020; --BE:#C07C08; --CZ:#5040B0; --BG:#A02828;
  --s0:0 2px 10px rgba(0,0,0,.3); --s1:0 8px 28px rgba(0,0,0,.48); --s2:0 20px 60px rgba(0,0,0,.62);
  --r6:6px; --r10:10px; --r14:14px; --r99:99px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--nv);color:var(--tx);display:flex;flex-direction:column;}

/* ═══ HEADER ═══════════════════════════════════ */
header{
  flex-shrink:0;height:54px;
  background:linear-gradient(135deg,var(--nv),var(--nv3));
  border-bottom:1px solid var(--bd2);
  display:flex;align-items:center;gap:10px;padding:0 14px;
  z-index:1001;box-shadow:0 2px 18px rgba(0,0,0,.4);
}
.logo{
  font-family:'Playfair Display',serif;font-size:17px;font-weight:700;
  color:var(--w);display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
}
.logo em{color:var(--gold);font-style:italic;}
.logo-n{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;
  color:var(--gold);background:rgba(240,180,41,.12);
  border:1px solid rgba(240,180,41,.28);border-radius:var(--r99);padding:2px 9px;white-space:nowrap;
}
.sw{flex:1;position:relative;max-width:280px;}
.sw input{
  width:100%;background:rgba(255,255,255,.09);border:1px solid var(--bd2);
  border-radius:var(--r10);color:var(--w);padding:7px 12px 7px 32px;
  font-family:'Inter',sans-serif;font-size:12px;outline:none;transition:all .2s;
}
.sw input::placeholder{color:rgba(255,255,255,.28);}
.sw input:focus{background:rgba(255,255,255,.14);border-color:var(--sea);}
.sw-i{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.35;font-size:13px;pointer-events:none;}
.hst{margin-left:auto;display:flex;gap:5px;flex-shrink:0;}
.hchip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:var(--r99);padding:3px 9px;font-size:10px;color:var(--tx2);}
.hchip strong{font-size:12px;font-weight:700;}
.hchip.cfr strong{color:#3DD880;}
.hchip.ceu strong{color:var(--gold);}
/* mobile: cacher les chips */
@media(max-width:640px){.hchip{display:none;}.logo-n{display:none;}}

/* ═══ FILTER BAR ════════════════════════════════ */
.fbar{
  flex-shrink:0;background:var(--nv2);border-bottom:1px solid var(--bd);
  padding:6px 14px;display:flex;align-items:center;gap:4px;
  overflow-x:auto;scrollbar-width:none;white-space:nowrap;
}
.fbar::-webkit-scrollbar{display:none;}
.fl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin-right:2px;flex-shrink:0;}
.sv{width:1px;height:16px;background:var(--bd2);margin:0 4px;flex-shrink:0;}
.fb{
  font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:var(--r99);
  border:1px solid var(--bd2);background:transparent;color:var(--tx2);
  cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.fb:hover{border-color:var(--sea);color:var(--sea);}
.fb.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.fb[data-f="all"].on{background:var(--sea2);}
.fb[data-f="FR"].on{background:var(--FR);}
.fb[data-f="IT"].on{background:var(--IT);}
.fb[data-f="PT"].on{background:var(--PT);}
.fb[data-f="CH"].on{background:var(--CH);}
.fb[data-f="BE"].on{background:var(--BE);}
.fb[data-f="CZ"].on{background:var(--CZ);}
.fb[data-f="BG"].on{background:var(--BG);}
.fb[data-f="prod"].on{background:#16844E;}
.fb[data-f="bio"].on{background:#3A9A1A;}
.fb[data-f="rare"].on{background:#C07818;}

/* ═══ LAYOUT ═════════════════════════════════════ */
.main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0;}
#map{flex:1;z-index:1;}

/* Leaflet */
.leaflet-control-zoom{margin-left:12px!important;margin-top:12px!important;}
.leaflet-control-zoom a{
  background:var(--nv3)!important;color:var(--w)!important;
  border:1px solid var(--bd3)!important;font-size:15px!important;
  width:30px!important;height:30px!important;line-height:28px!important;
}
.leaflet-control-zoom a:hover{background:var(--nv4)!important;}
.leaflet-control-attribution{
  background:rgba(13,27,42,.85)!important;color:var(--tx3)!important;
  font-size:9px!important;backdrop-filter:blur(4px);
}
.leaflet-control-attribution a{color:var(--tx2)!important;}

/* ═══ FLOTTANTS ══════════════════════════════════ */
.fcnt{
  position:absolute;top:10px;left:12px;z-index:500;
  background:rgba(13,27,42,.93);border:1px solid var(--bd3);
  border-radius:var(--r10);padding:5px 12px;
  font-size:11px;font-weight:600;color:var(--w);
  pointer-events:none;backdrop-filter:blur(10px);box-shadow:var(--s0);
}
/* bouton ouvrir liste mobile */
.mob-list-btn{
  display:none;
  position:absolute;bottom:24px;right:14px;z-index:600;
  background:var(--nv3);border:1px solid var(--bd3);
  border-radius:var(--r99);padding:9px 16px;
  font-size:12px;font-weight:700;color:var(--w);
  cursor:pointer;box-shadow:var(--s1);gap:6px;align-items:center;
}
@media(max-width:768px){.mob-list-btn{display:flex;}}

.legend{
  position:absolute;bottom:20px;left:12px;z-index:500;
  background:rgba(13,27,42,.94);border:1px solid var(--bd3);
  border-radius:var(--r10);padding:11px 14px;
  backdrop-filter:blur(12px);box-shadow:var(--s1);
}
@media(max-width:600px){.legend{display:none;}}
.leg-t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);margin-bottom:8px;}
.leg-r{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--tx2);margin-bottom:4px;cursor:pointer;transition:color .12s;}
.leg-r:last-child{margin-bottom:0;}
.leg-r:hover{color:var(--w);}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ═══ SIDEBAR ════════════════════════════════════ */
.sidebar{
  width:320px;flex-shrink:0;
  background:#0F2035;border-left:1px solid rgba(255,255,255,.09);
  display:flex;flex-direction:column;overflow:hidden;z-index:400;
  box-shadow:-3px 0 16px rgba(0,0,0,.35);transition:transform .3s ease;
}
/* MOBILE sidebar = drawer par dessus la carte */
@media(max-width:768px){
  .sidebar{
    position:absolute;top:0;right:0;bottom:0;
    width:88vw;max-width:360px;z-index:700;
    transform:translateX(100%);
  }
  .sidebar.open{transform:translateX(0);}
}
.sb-hd{padding:12px 15px 9px;background:#0A1828;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;}
.sb-hd h2{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--w);flex:1;}
.sb-hd p{font-size:10px;color:var(--tx2);}
.sb-cls{display:none;background:rgba(255,255,255,.08);border:1px solid var(--bd2);border-radius:50%;width:26px;height:26px;color:var(--tx2);font-size:13px;cursor:pointer;flex-shrink:0;align-items:center;justify-content:center;}
@media(max-width:768px){.sb-cls{display:flex;}}
.lw{flex:1;overflow-y:auto;min-height:0;}
.lw::-webkit-scrollbar{width:3px;}
.lw::-webkit-scrollbar-thumb{background:#2A4468;border-radius:2px;}

/* Country header */
.ch{
  position:sticky;top:0;z-index:10;
  padding:5px 15px;background:#081522;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:6px;
}
.ch-f{font-size:14px;}
.ch-n{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--tx2);flex:1;}
.ch-c{font-size:9px;font-weight:700;background:rgba(255,255,255,.08);color:var(--tx2);border-radius:var(--r99);padding:1px 8px;}

/* Item */
.it{
  padding:10px 15px;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;transition:background .1s;
  display:flex;gap:9px;align-items:flex-start;
}
.it:hover{background:#162840;}
.it.active{background:#1E3A5C;border-left:3px solid var(--sea);}
.it-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.it-b{flex:1;min-width:0;}
.it-n{font-size:12px;font-weight:600;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px;}
.it-l{font-size:10px;color:var(--tx2);}
.it-t{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}

/* Tags */
.tag{font-size:8px;font-weight:700;padding:1px 6px;border-radius:var(--r99);text-transform:uppercase;letter-spacing:.35px;}
.tp{background:rgba(22,132,78,.2);color:#4DCC88;}
.tv{background:rgba(200,120,8,.18);color:#E0A030;}
.tb{background:rgba(58,154,26,.2);color:#78CC48;}
.tr{background:rgba(192,112,20,.18);color:#D89838;}
.to{background:rgba(41,182,216,.14);color:#58C8E8;}
.nr{padding:36px 15px;text-align:center;color:var(--tx2);font-size:12px;}
.nr span{font-size:24px;display:block;margin-bottom:7px;}

/* ═══ MODAL ══════════════════════════════════════ */
.ov{
  display:none;position:fixed;inset:0;
  background:rgba(5,10,20,.72);backdrop-filter:blur(8px);
  z-index:2000;align-items:flex-end;justify-content:center;padding:0;
}
.ov.open{display:flex;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes popIn{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal{
  background:#112030;border:1px solid var(--bd3);
  width:100%;max-width:520px;overflow:hidden;
  /* desktop: centré */
  border-radius:var(--r14);
  box-shadow:var(--s2);
  animation:popIn .22s cubic-bezier(.34,1.3,.64,1);
  max-height:92vh;overflow-y:auto;
  margin:auto;
}
/* mobile: bottom sheet */
@media(max-width:640px){
  .ov{align-items:flex-end;}
  .modal{
    border-radius:var(--r14) var(--r14) 0 0;
    max-width:100%;animation:slideUp .28s ease;
    max-height:88vh;
  }
}
.mhd{
  padding:18px 20px 14px;
  background:linear-gradient(135deg,var(--nv3),var(--nv5));
  border-bottom:1px solid var(--bd);position:relative;
  position:sticky;top:0;z-index:5;
}
/* drag handle mobile */
.drag-h{
  display:none;width:36px;height:4px;background:rgba(255,255,255,.25);
  border-radius:2px;margin:0 auto 12px;
}
@media(max-width:640px){.drag-h{display:block;}}
.m-fl{font-size:26px;display:block;margin-bottom:6px;line-height:1;}
.m-nm{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--w);line-height:1.2;margin-bottom:3px;}
.m-lc{font-size:11px;color:var(--tx2);}
.m-ct{display:inline-flex;align-items:center;gap:5px;margin-top:7px;background:rgba(255,255,255,.08);border:1px solid var(--bd2);border-radius:var(--r99);padding:2px 10px;font-size:9.5px;font-weight:600;color:var(--tx2);}
.m-x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid var(--bd2);color:var(--tx2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.m-x:hover{background:rgba(255,255,255,.2);color:var(--w);}
.m-bd{padding:15px 20px 20px;}
.m-pv{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--r6);font-size:10.5px;font-weight:700;letter-spacing:.15px;margin-bottom:9px;}
.m-pv.P{background:rgba(22,132,78,.18);color:#4DCC88;border:1px solid rgba(22,132,78,.3);}
.m-pv.V{background:rgba(200,120,8,.15);color:#E0A030;border:1px solid rgba(200,120,8,.28);}
.m-pv.PV{background:rgba(90,90,200,.15);color:#9898F0;border:1px solid rgba(90,90,200,.28);}
.m-tgs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.m-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:var(--r99);text-transform:uppercase;letter-spacing:.4px;}
.m-ds{font-size:12.5px;color:var(--tx2);line-height:1.7;padding:11px 14px;background:rgba(255,255,255,.04);border-radius:var(--r10);border-left:3px solid var(--sea);margin-bottom:13px;}
.m-gr{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px;}
.m-cl{background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:var(--r6);padding:8px 10px;}
.m-cl .l{font-size:8px;text-transform:uppercase;letter-spacing:.55px;color:var(--tx3);margin-bottom:2px;font-weight:700;}
.m-cl .v{font-size:11px;font-weight:600;color:var(--w);}
.m-co{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:var(--r6);padding:9px 12px;font-size:11px;color:var(--tx2);line-height:1.8;margin-bottom:13px;}
.m-co a{color:var(--sea);text-decoration:none;}
.m-co a:hover{text-decoration:underline;}
.m-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--sea3),var(--sea));
  color:#fff;border:none;border-radius:var(--r10);
  font-family:'Inter',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:all .18s;
  box-shadow:0 4px 18px rgba(25,140,170,.4);
}
.m-btn:hover{background:linear-gradient(135deg,#0A5060,var(--sea2));transform:translateY(-1px);box-shadow:0 6px 24px rgba(25,140,170,.55);}
.m-btn:active{transform:translateY(0);}
/* modal scrollbar */
.modal::-webkit-scrollbar{width:3px;}
.modal::-webkit-scrollbar-thumb{background:var(--nv5);}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">🍋 La Route des <em>Agrumes</em></div>
  <span class="logo-n" id="main-badge">61 pépinières</span>
  <div class="sw">
    <span class="sw-i">🔍</span>
    <input type="text" id="search" placeholder="Rechercher…" oninput="doSearch(this.value)">
  </div>
  <div class="hst">
    <div class="hchip cfr">🇫🇷 <strong id="cnt-fr">47</strong></div>
    <div class="hchip ceu">🌍 <strong id="cnt-eu">14</strong></div>
  </div>
</header>

<!-- FILTRES -->
<div class="fbar">
  <span class="fl">Pays:</span>
  <button class="fb on" data-f="all" onclick="setF('all',this)">🌍 Tous</button>
  <button class="fb" data-f="FR"   onclick="setF('FR',this)">🇫🇷 France</button>
  <button class="fb" data-f="IT"   onclick="setF('IT',this)">🇮🇹 Italie</button>
  <button class="fb" data-f="PT"   onclick="setF('PT',this)">🇵🇹 Portugal</button>
  <button class="fb" data-f="CH"   onclick="setF('CH',this)">🇨🇭 Suisse</button>
  <button class="fb" data-f="BE"   onclick="setF('BE',this)">🇧🇪 Belgique</button>
  <button class="fb" data-f="CZ"   onclick="setF('CZ',this)">🇨🇿 Tchéquie</button>
  <button class="fb" data-f="BG"   onclick="setF('BG',this)">🇧🇬 Bulgarie</button>
  <div class="sv"></div>
  <span class="fl">Type:</span>
  <button class="fb" data-f="prod" onclick="setF('prod',this)">🌿 Producteur</button>
  <button class="fb" data-f="bio"  onclick="setF('bio',this)">🌱 Bio</button>
  <button class="fb" data-f="rare" onclick="setF('rare',this)">⭐ Rares</button>
</div>

<!-- MAIN -->
<div class="main">
  <div id="map"></div>

  <div class="fcnt" id="fcnt">61 pépinières</div>

  <!-- Légende desktop -->
  <div class="legend">
    <div class="leg-t">Filtrer par pays</div>
    <div class="leg-r" onclick="setFLeg('FR')"><span class="leg-dot" style="background:var(--FR)"></span>🇫🇷 France</div>
    <div class="leg-r" onclick="setFLeg('IT')"><span class="leg-dot" style="background:var(--IT)"></span>🇮🇹 Italie</div>
    <div class="leg-r" onclick="setFLeg('PT')"><span class="leg-dot" style="background:var(--PT)"></span>🇵🇹 Portugal</div>
    <div class="leg-r" onclick="setFLeg('CH')"><span class="leg-dot" style="background:var(--CH)"></span>🇨🇭 Suisse</div>
    <div class="leg-r" onclick="setFLeg('BE')"><span class="leg-dot" style="background:var(--BE)"></span>🇧🇪 Belgique</div>
    <div class="leg-r" onclick="setFLeg('CZ')"><span class="leg-dot" style="background:var(--CZ)"></span>🇨🇿 Tchéquie</div>
    <div class="leg-r" onclick="setFLeg('BG')"><span class="leg-dot" style="background:var(--BG)"></span>🇧🇬 Bulgarie</div>
    <div class="leg-r" style="margin-top:6px;border-top:1px solid rgba(255,255,255,.08);padding-top:6px" onclick="setFLeg('all')"><span class="leg-dot" style="background:var(--sea2)"></span>Tout afficher</div>
  </div>

  <!-- Bouton ouvrir liste (mobile) -->
  <div class="mob-list-btn" id="mob-btn" onclick="openSidebar()">
    📋 <span id="mob-cnt">61 pépinières</span>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-hd">
      <div>
        <h2>🗺 Pépinières référencées</h2>
        <p id="sb-count">61 établissements · 7 pays</p>
      </div>
      <button class="sb-cls" onclick="closeSidebar()">✕</button>
    </div>
    <div class="lw" id="lw"></div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="ov" onclick="closeOv(event)">
  <div class="modal">
    <div class="mhd">
      <div class="drag-h"></div>
      <span class="m-fl" id="m-fl">🍋</span>
      <div class="m-nm" id="m-nm">—</div>
      <div class="m-lc" id="m-lc">—</div>
      <div class="m-ct" id="m-ct"></div>
      <button class="m-x" onclick="closeMod()">✕</button>
    </div>
    <div class="m-bd">
      <div id="m-pv" class="m-pv P"></div>
      <div id="m-tgs" class="m-tgs"></div>
      <div id="m-ds"  class="m-ds"></div>
      <div id="m-gr"  class="m-gr"></div>
      <div id="m-co"  class="m-co" style="display:none"></div>
      <a   id="m-btn" class="m-btn" href="#" target="_blank" rel="noopener">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Visiter le site officiel
      </a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   DONNÉES — 61 PÉPINIÈRES
   Ordre alphabétique par pays puis par nom
   Adresses exactes vérifiées
   P=Producteur V=Revendeur PV=Les deux
   ═══════════════════════════════════════════════════════ */
const D=[

/* ══ FRANCE — Ordre alphabétique ══════════════════════ */
{id:1, co:"FR",fl:"🇫🇷",pv:"PV",
 name:"À l'Ombre des Figuiers",
 loc:"1 ch. Kelenneg Vihan, ZA Bel Air, 29700 Pluguffan",
 lat:47.9721,lon:-4.1478,

/* ═══════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════ */
const CC={FR:"#16844E",IT:"#D04A18",PT:"#C02020",CH:"#982020",BE:"#C07C08",CZ:"#5040B0",BG:"#A02828"};
const CN={FR:"🇫🇷 France",IT:"🇮🇹 Italie",PT:"🇵🇹 Portugal",CH:"🇨🇭 Suisse",BE:"🇧🇪 Belgique",CZ:"🇨🇿 Rép. Tchèque",BG:"🇧🇬 Bulgarie"};
const TC={rare:"tr",bio:"tb",online:"to"};
const TL={rare:"Rares",bio:"Bio",online:"En ligne"};
const CO=["FR","BE","BG","IT","PT","CZ","CH"];
const PVL={P:"🌿 Producteur / Greffeur",V:"🏪 Revendeur",PV:"🌿🏪 Producteur & Revendeur"};

const col=p=>CC[p.co]||"#555";
const isMobile=()=>window.innerWidth<=768;

function mkIcon(p,big=false){
  const c=col(p),s=big?42:28;
  return L.divIcon({
    className:"",
    html:`<div style="width:${s}px;height:${s}px;background:${c};border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 3px 14px rgba(0,0,0,.5),0 0 0 ${big?3:2}px rgba(255,255,255,${big?.55:.3});display:flex;align-items:center;justify-content:center;transition:all .2s;"><span style="transform:rotate(45deg);font-size:${big?14:10}px;line-height:1;">${p.fl}</span></div>`,
    iconSize:[s,s],iconAnchor:[s/2,s],popupAnchor:[0,-s]
  });
}

/* ═══ MAP ═══════════════════════════════════════ */
const map=L.map("map",{center:[47,8],zoom:5,zoomControl:true});
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains:"abcd",maxZoom:19
}).addTo(map);

const MK={};
let FILT="all",SRH="",SEL=null;
D.forEach(p=>{
  const m=L.marker([p.lat,p.lon],{icon:mkIcon(p)}).addTo(map);
  m.on("click",()=>{openMod(p.id);if(isMobile())closeSidebar();});
  MK[p.id]=m;
});

/* ═══ RENDER ════════════════════════════════════ */
function filtered(){
  return D.filter(p=>{
    const mf=FILT==="all"||p.co===FILT||p.tags.includes(FILT)||
              (FILT==="prod"&&(p.pv==="P"||p.pv==="PV"));
    const ms=!SRH||
      p.name.toLowerCase().includes(SRH)||
      p.loc.toLowerCase().includes(SRH)||
      (CN[p.co]||"").toLowerCase().includes(SRH);
    return mf&&ms;
  });
}

function render(){
  const f=filtered(),ids=new Set(f.map(p=>p.id));
  const n=f.length;
  document.getElementById("main-badge").textContent=n+" pépinières";
  document.getElementById("fcnt").textContent=n+" pépinières affichées";
  document.getElementById("mob-cnt").textContent=n+" pépinières";
  document.getElementById("sb-count").textContent=n+" établissements · 7 pays";
  document.getElementById("cnt-fr").textContent=f.filter(p=>p.co==="FR").length;
  document.getElementById("cnt-eu").textContent=f.filter(p=>p.co!=="FR").length;
  D.forEach(p=>{ids.has(p.id)?(!map.hasLayer(MK[p.id])&&MK[p.id].addTo(map)):map.removeLayer(MK[p.id]);});

  const byC={};
  f.forEach(p=>{(byC[p.co]=byC[p.co]||[]).push(p);});
  let h="";
  CO.forEach(co=>{
    if(!byC[co])return;
    h+=`<div class="ch"><span class="ch-f">${byC[co][0].fl}</span><span class="ch-n">${CN[co]||co}</span><span class="ch-c">${byC[co].length}</span></div>`;
    byC[co].forEach(p=>{
      const c=col(p);
      const pvCls=p.pv==="P"?"tp":p.pv==="PV"?"tp":"tv";
      const pvLbl=p.pv==="P"?"Producteur":p.pv==="PV"?"Prod. & Revendeur":"Revendeur";
      const tgs=p.tags.map(t=>`<span class="tag ${TC[t]||""}">${TL[t]||t}</span>`).join("");
      h+=`<div class="it${SEL===p.id?" active":""}" id="li-${p.id}" onclick="openMod(${p.id})">
        <span class="it-dot" style="background:${c}"></span>
        <div class="it-b">
          <div class="it-n">${p.name}</div>
          <div class="it-l">📍 ${p.loc.split(",")[0]}</div>
          <div class="it-t"><span class="tag ${pvCls}">${pvLbl}</span>${tgs}</div>
        </div>
      </div>`;
    });
  });
  document.getElementById("lw").innerHTML=h||`<div class="nr"><span>🔍</span>Aucun résultat</div>`;
}

/* ═══ MODAL ═════════════════════════════════════ */
function openMod(id){
  SEL=id;
  const p=D.find(x=>x.id===id);
  if(!p)return;
  D.forEach(pp=>{map.hasLayer(MK[pp.id])&&MK[pp.id].setIcon(mkIcon(pp,false));});
  MK[p.id].setIcon(mkIcon(p,true));
  if(!isMobile()) map.setView([p.lat,p.lon],Math.max(map.getZoom(),9),{animate:true,duration:.5});

  document.getElementById("m-fl").textContent=p.fl;
  document.getElementById("m-nm").textContent=p.name;
  document.getElementById("m-lc").innerHTML="📍 "+p.loc;
  document.getElementById("m-ct").innerHTML=p.fl+" "+(CN[p.co]||p.co);

  const pvEl=document.getElementById("m-pv");
  pvEl.className="m-pv "+(p.pv==="V"?"V":p.pv==="PV"?"PV":"P");
  pvEl.textContent=PVL[p.pv]||"—";

  document.getElementById("m-tgs").innerHTML=p.tags.map(t=>`<span class="m-tag tag ${TC[t]||""}">${TL[t]||t}</span>`).join("");
  document.getElementById("m-ds").textContent=p.spec;
  document.getElementById("m-gr").innerHTML=`
    <div class="m-cl"><div class="l">Note</div><div class="v">${p.note}</div></div>
    <div class="m-cl"><div class="l">Vente</div><div class="v">${p.vente}</div></div>
    <div class="m-cl"><div class="l">Pays</div><div class="v">${p.fl} ${p.co}</div></div>`;
  const lines=[];
  if(p.tel)lines.push("📞 "+p.tel);
  if(p.email)lines.push(`✉️ <a href="mailto:${p.email}">${p.email}</a>`);
  const cEl=document.getElementById("m-co");
  if(lines.length){cEl.style.display="block";cEl.innerHTML=lines.join("<br>");}else cEl.style.display="none";
  const btn=document.getElementById("m-btn");
  btn.href=p.site;
  btn.innerHTML=`<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Visiter le site officiel`;
  document.getElementById("ov").classList.add("open");
  render();
  setTimeout(()=>{const el=document.getElementById("li-"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});},80);
}

function closeOv(e){if(e.target===document.getElementById("ov"))closeMod();}
function closeMod(){
  document.getElementById("ov").classList.remove("open");
  SEL=null;
  D.forEach(p=>{map.hasLayer(MK[p.id])&&MK[p.id].setIcon(mkIcon(p,false));});
  render();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMod();});

/* ═══ SIDEBAR MOBILE ════════════════════════════ */
function openSidebar(){document.getElementById("sidebar").classList.add("open");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");}

/* ═══ FILTRES ═══════════════════════════════════ */
function setF(f,btn){
  FILT=f;
  document.querySelectorAll(".fb").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  render();
}
function setFLeg(co){
  FILT=co;
  document.querySelectorAll(".fb").forEach(b=>b.classList.remove("on"));
  const b=document.querySelector(`.fb[data-f="${co}"]`);
  if(b)b.classList.add("on");
  render();
}
function doSearch(v){SRH=v.toLowerCase();render();}

// Fermer sidebar si clic sur la carte (mobile)
document.getElementById("map").addEventListener("click",()=>{if(isMobile())closeSidebar();});

render();
</script>
