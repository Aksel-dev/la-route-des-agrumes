<style>
:root{--bg:#0f1419;--p:#131a21;--p2:#1a232d;--p3:#243040;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
--tx:#E6EBF0;--tx2:#9AA8B6;--tx3:#66788A;--g:#D69E2E;--g2:#E6C068;--gbg:rgba(214,158,46,.14);
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100vh;height:100dvh;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
#map{position:absolute;inset:0;background:#cfe0e4}
.leaflet-control-zoom{border:0!important;box-shadow:0 6px 20px rgba(0,0,0,.4)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--p)!important;color:var(--tx)!important;border-color:var(--line)!important;width:38px!important;height:38px!important;line-height:38px!important}
.leaflet-top.leaflet-right{top:calc(var(--st) + 6px)}

/* PANNEAU */
#panel{position:absolute;z-index:500;display:flex;flex-direction:column;left:16px;top:calc(16px + var(--st));bottom:16px;width:396px;background:rgba(19,26,33,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.grab{display:none}
.ph{flex-shrink:0;padding:16px 16px 4px}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.brand svg{width:36px;height:36px;flex-shrink:0}
.brand h1{font:700 20px/1.1 'Fraunces',serif;color:#fff}
.brand h1 em{font-style:italic;color:var(--g2)}
.brand small{display:block;font-size:11px;color:var(--tx2);margin-top:3px}
.search{position:relative;display:block}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border-radius:14px;border:1px solid var(--line2);background:var(--p2);outline:none;font-size:14px;transition:.15s}
.search input::placeholder{color:var(--tx3)}
.search input:focus{border-color:var(--g);box-shadow:0 0 0 3px var(--gbg)}
.search svg{position:absolute;left:14px;top:50%;margin-top:-9px;width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 4px;margin:0 -16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);color:var(--tx2);font-size:12.5px;font-weight:600;white-space:nowrap;transition:.15s}
.chip:hover{color:#fff;border-color:var(--g)}
.chip.on{background:var(--g);border-color:var(--g);color:#14181d}
.chip .fi{width:18px;height:13px;border-radius:2px}
.chip small{font-size:10.5px;opacity:.65;font-weight:700}
.bar{display:flex;align-items:center;gap:8px;padding:10px 0 8px;font-size:12px;color:var(--tx2)}
.bar b{color:#fff}
.bar .sp{flex:1}
.link{color:var(--g2);font-weight:600;font-size:12px;padding:4px 2px}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;background:var(--p2);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--tx)}
.fbtn i{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#14181d;font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center}
.fbtn.has i{display:inline-flex}
.tray{display:none;padding:2px 0 10px}
.tray.open{display:block}
.tray h4{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--tx3);margin:8px 0 7px}
.tray div{display:flex;flex-wrap:wrap;gap:7px}
.pb{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line);overscroll-behavior:contain}
.pb::-webkit-scrollbar{width:5px}.pb::-webkit-scrollbar-thumb{background:var(--p3);border-radius:3px}
#panel[data-view=detail] .ph{display:none}
#panel[data-view=detail] .pb{border-top:0}
#panel[data-view=list] #detail,#panel[data-view=detail] #list{display:none}

/* LISTE */
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(19,26,33,.97);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--line)}
.gh .fi{width:16px;height:12px;border-radius:2px}.gh span:last-child{margin-left:auto}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.row:hover{background:rgba(255,255,255,.04)}
.row.act{background:var(--gbg);box-shadow:inset 3px 0 0 var(--g)}
.fl{flex:none;width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.85)}
.fl .fi{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.rb{min-width:0;flex:1}
.rn{font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl{font-size:11.5px;color:var(--tx2);margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd{flex:none;font-size:11.5px;font-weight:700;color:var(--g2)}
.rc{flex:none;width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.3px;white-space:nowrap;background:var(--p3);color:var(--tx2)}
.t-prod{background:rgba(74,222,128,.14);color:#6EE7A0}.t-pv{background:rgba(147,197,253,.14);color:#93C5FD}.t-rev{background:rgba(230,192,104,.14);color:var(--g2)}
.t-bio,.t-bioconv{background:rgba(34,197,94,.16);color:#86EFAC}.t-hve{background:rgba(234,179,8,.16);color:#FDE047}
.t-rare{background:var(--gbg);color:var(--g2)}.t-online{background:rgba(56,189,248,.14);color:#7DD3FC}
.t-local{background:rgba(167,139,250,.16);color:#C4B5FD}.t-verger{background:rgba(251,113,133,.16);color:#FDA4AF}.t-new{background:rgba(250,204,21,.18);color:#FDE047}
.empty{padding:50px 24px;text-align:center;color:var(--tx2);font-size:13px;line-height:1.6}.empty b{display:block;font-size:30px;margin-bottom:8px}
.foot{padding:14px 16px calc(16px + var(--sb));font-size:10px;color:var(--tx3);line-height:1.6}
.foot a{color:var(--tx2);text-decoration:underline}

/* FICHE */
.dtop{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;background:linear-gradient(var(--p) 70%,transparent)}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;background:var(--p2);border:1px solid var(--line2);font-size:13px;font-weight:600}
.ibtn:hover{border-color:var(--g)}
.dh{padding:6px 18px 4px}
.dc{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tx2);margin-bottom:10px}
.dc .fl{width:26px;height:26px;border-width:1.5px}
.dn{font:700 25px/1.15 'Fraunces',serif;color:#fff;margin-bottom:6px}
.dl{font-size:13px;color:var(--tx2);margin-bottom:12px;line-height:1.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px 4px}
.ac{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:13px;background:var(--p2);border:1px solid var(--line2);font-size:13px;font-weight:600;transition:.15s}
.ac:hover{border-color:var(--g);transform:translateY(-1px)}
.ac.pri{background:var(--g);border-color:var(--g);color:#14181d;grid-column:1/-1}
.dd{margin:14px 18px;padding:14px 16px;font-size:13.5px;line-height:1.75;color:var(--tx);background:var(--p2);border-left:3px solid var(--g);border-radius:0 14px 14px 0}
.cert{margin:0 18px 14px;padding:12px 14px;font-size:12.5px;line-height:1.65;color:var(--tx2);border:1px solid var(--line);border-radius:14px}
.cert b{color:#fff}.cert div+div{margin-top:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 18px 14px}
.cell{padding:11px 13px;background:var(--p2);border:1px solid var(--line);border-radius:12px}
.cell small{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);font-weight:700;margin-bottom:4px}
.cell span{font-size:13px;font-weight:600;color:#fff}
.ct{margin:0 18px 18px;font-size:13px;line-height:2.1;color:var(--tx2)}.ct a{color:var(--g2)}

/* CARTE : marqueurs + boutons flottants */
.mk{transform-origin:50% 100%;transition:transform .15s}
.mk:hover{transform:scale(1.12)}
.zl .mk{transform:scale(.78)}.zl .mk:hover{transform:scale(.92)}
.mk-h{border-radius:50%;overflow:hidden;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.mk-h .fi{display:block;width:100%;height:100%;background-size:cover;background-position:center}
.mk-t{display:block;width:0;height:0;margin:-1px auto 0;border:6px solid transparent;border-bottom:0;border-top-color:var(--c)}
.mk.sel .mk-h{border-color:var(--g);box-shadow:0 0 0 4px rgba(214,158,46,.4),0 6px 16px rgba(0,0,0,.55)}
.fab{position:absolute;z-index:450;right:10px;top:calc(var(--st) + 100px);width:38px;height:38px;border-radius:12px;background:var(--p);border:0;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:17px}
.fab:hover{background:var(--p2)}
.leaflet-tooltip.tip{background:var(--p);border:1px solid var(--line2);border-radius:9px;color:#fff;font:600 12px 'Plus Jakarta Sans',sans-serif;padding:5px 10px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.leaflet-tooltip.tip::before{display:none}
.leaflet-tooltip.reg{background:var(--p);border:1px solid var(--line2);color:var(--g2);font:700 10px 'Plus Jakarta Sans',sans-serif;border-radius:5px}
.leaflet-tooltip.reg::before{display:none}
.toast{position:fixed;z-index:3000;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);max-width:90vw;padding:10px 16px;border-radius:99px;background:var(--p);border:1px solid var(--g);color:var(--g2);font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}

/* TABLETTE */
@media(min-width:761px) and (max-width:1024px){#panel{width:344px}}

/* MOBILE : panneau type « bottom sheet » à 3 hauteurs */
@media(max-width:760px){
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:22px 22px 0 0;border-bottom:0;transition:height .3s cubic-bezier(.4,0,.2,1);padding-bottom:var(--sb)}
  #panel[data-sheet=peek]{height:calc(172px + var(--sb))}
  #panel[data-sheet=half]{height:52dvh}
  #panel[data-sheet=full]{height:calc(100dvh - var(--st) - 52px)}
  .grab{display:flex;justify-content:center;padding:10px 0 4px;touch-action:none;cursor:grab;flex-shrink:0}
  .grab i{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
  .ph{padding-top:4px}
  .brand{margin-bottom:10px}.brand svg{width:30px;height:30px}.brand h1{font-size:18px}.brand small{display:none}
  .leaflet-control-zoom{display:none}
  .fab{top:calc(var(--st) + 12px);width:44px;height:44px}
  .chip{height:38px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

{id:67,co:"ES",fc:"es",pv:"P",name:"Agrumes.pro",loc:"Camí Font de la Parra, 46740 Carcaixent (Valence)",lat:39.102,lon:-0.421,tags:["rare"],spec:"Province de Valence (Espagne). Verger de production et conservatoire d'Olivier Biggio (expert et formateur), géré avec Fabien Roussel. Agrumes de collection (Dekopon/Sumo, Orri, Tangelo Alizza, Yuzu, Orange M7...) et important pôle d'exotiques (avocatiers, manguiers). Lieu de stages et formations à la culture des agrumes. Vente en ligne via Fruit Friends (Finestret, FR).",site:"https://agrumes.pro/",tel:"+33 6 35 27 00 95",email:"ecoartlodge@gmail.com",note:"Verger / stages",vente:"Verger — vente via Fruit Friends"},
{id:59,co:"CZ",fc:"cz",pv:"P",name:"Adavo / Adam Bajer",loc:"Chelčického 281, 281 44 Velký Osek",lat:50.1045,lon:15.1985,tags:["online"],spec:"Bohême centrale. Agrumes greffés sur Swingle 4475 et Poncirus. Livraison Europe.",site:"https://rakytnik.com/",tel:"+420 775 145 061",note:"4.7/5",vente:"Sur place + en ligne"},
{id:60,co:"CZ",fc:"cz",pv:"V",name:"Ekozahradnictvi",loc:"Tojice 16, 335 01 Nepomuk",lat:49.4895,lon:13.5812,tags:["online"],spec:"Bohême du Sud. Jardinerie écologique tchèque avec rayon agrumes. E-shop en tchèque.",site:"https://www.ekozahradnictvi.cz/e-shop/",note:"3.9/5",vente:"Sur place + en ligne"},
{id:61,co:"CH",fc:"ch",pv:"P",name:"AlpAgrumi",loc:"Via Alla Riviera 24, 6512 Giubiasco (Bellinzona)",lat:46.182,lon:9.0128,tags:["rare","online"],spec:"Tessin. Livraison maison avec leur propre service pour éviter tout dommage. Yuzu, agrumes rares. Fiches conseils très détaillées.",site:"https://alpagrumi.ch/",tel:"+41 76 247 36 26",note:"5.0/5",vente:"Livraison maison"},
{id:62,co:"CH",fc:"ch",pv:"P",name:"Eisenhut Vivaio",loc:"Via Piaggia 14, 6575 San Nazzaro (Gambarogno)",lat:46.1105,lon:8.8225,tags:["rare","online"],spec:"Tessin. Jardin botanique + pépinière au bord du lac Majeur. Magnolias, camélias, agrumes rustiques. Vue exceptionnelle.",site:"https://eisenhut.ch/fr/",tel:"+41 91 795 18 67",note:"4.5/5",vente:"Sur place + en ligne"}
];
</script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const mobile=()=>matchMedia("(max-width:760px)").matches;
const CC={FR:"#15803D",IT:"#C2410C",PT:"#B91C1C",ES:"#A16207",CH:"#9F1239",BE:"#92400E",CZ:"#3730A3",BG:"#7C2D12"};
const CN={FR:"France",IT:"Italie",PT:"Portugal",ES:"Espagne",CH:"Suisse",BE:"Belgique",CZ:"Tchéquie",BG:"Bulgarie"};
const ORDER=["FR","BE","BG","IT","PT","ES","CZ","CH"];
const TAGS={bio:["t-bio","🌱 Bio AB"],bioconv:["t-bioconv","🌿 Bio"],hve:["t-hve","🏅 HVE"],rare:["t-rare","⭐ Rares"],online:["t-online","🌐 En ligne"],local:["t-local","📍 Local"],verger:["t-verger","🌳 Verger"]};
const PV={P:["t-prod","Producteur"],PV:["t-pv","Prod. & Rev."],V:["t-rev","Revendeur"]};
const CERTS={bio:"<b>Agriculture Biologique AB</b> — production certifiée sans pesticides ni engrais de synthèse, contrôlée par un organisme agréé.",hve:"<b>Haute Valeur Environnementale</b> — certification agro-environnementale française (biodiversité, fertilisation, eau). Distincte du Bio AB."};
const TYPES=[["prod","🌿 Producteur",p=>p.pv!=="V"],["bio","🌱 Bio",p=>p.tags.includes("bio")||p.tags.includes("bioconv")],["hve","🏅 HVE",p=>p.tags.includes("hve")],["rare","⭐ Variétés rares",p=>p.tags.includes("rare")]];
const LIVS=[["envoi","📦 Envoi possible",p=>p.tags.includes("online")],["place","🏡 Sur place seulement",p=>!p.tags.includes("online")]];
const byId=Object.fromEntries(D.map(p=>[p.id,p]));
const S={co:"all",types:new Set(),liv:null,q:"",sel:null,user:null,sheet:"half"};

function matches(p,skipCo){
  if(!skipCo&&S.co!=="all"&&p.co!==S.co)return false;
  for(const k of S.types)if(!TYPES.find(t=>t[0]===k)[2](p))return false;
  if(S.liv&&!LIVS.find(t=>t[0]===S.liv)[2](p))return false;
  return !S.q||norm(p.name+" "+p.loc+" "+(CN[p.co]||"")+" "+p.spec).includes(S.q);
}
const rad=x=>x*Math.PI/180;
function dist(a,b){const h=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lon-a.lon)/2)**2;return 12742*Math.asin(Math.sqrt(h));}
const km=d=>d<10?d.toFixed(1).replace(".",",")+" km":Math.round(d).toLocaleString("fr-FR")+" km";
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3800);}

/* ── CARTE ── */
const map=L.map("map",{zoomControl:false,attributionControl:false,center:[46.6,4.5],zoom:5,minZoom:3});
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",{subdomains:"abc",maxZoom:19}).addTo(map);
const layer=L.layerGroup().addTo(map);
const zl=()=>map.getContainer().classList.toggle("zl",map.getZoom()<=6);
map.on("zoomend",zl);zl();

function icon(p,sel){
  const w=sel?46:34;
  return L.divIcon({className:"",iconSize:[w,w+9],iconAnchor:[w/2,w+9],
    html:`<div class="mk${sel?" sel":""}" style="--c:${CC[p.co]||"#555"};width:${w}px"><div class="mk-h" style="width:${w}px;height:${w}px"><span class="fi fi-${esc(p.fc)}"></span></div><i class="mk-t"></i></div>`});
}
const MK={},touch=matchMedia("(pointer:coarse)").matches;
D.forEach(p=>{
  const m=L.marker([p.lat,p.lon],{icon:icon(p,false),title:p.name,keyboard:true});
  if(!touch)m.bindTooltip(esc(p.name),{direction:"top",className:"tip",offset:[0,-38]});
  m.on("click",()=>openDetail(p.id));
  MK[p.id]=m;
});

const EU=new Set([8,20,40,56,70,100,191,203,208,233,246,250,276,300,348,352,372,380,428,438,440,442,470,492,498,499,528,578,616,620,642,643,674,688,703,705,724,752,756,804,807,826]);
Promise.all([
  fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json()),
  fetch("https://cdn.jsdelivr.net/gh/gregoiredavid/france-geojson@master/regions-version-simplifiee.geojson").then(r=>r.json())
]).then(([w,reg])=>{
  const all=topojson.feature(w,w.objects.countries);
  L.geoJSON({type:"FeatureCollection",features:all.features.filter(f=>EU.has(+f.id))},{style:{color:"#5b7a8c",weight:1,opacity:.7,fillOpacity:0,interactive:false},pane:"tilePane"}).addTo(map);
  L.geoJSON(reg,{style:{color:"#B7791F",weight:1.6,opacity:.7,dashArray:"6,5",fillColor:"#D69E2E",fillOpacity:.04},
    onEachFeature:(f,l)=>{if(f.properties.nom)l.bindTooltip(f.properties.nom,{sticky:true,className:"reg"});}}).addTo(map);
}).catch(()=>toast("Les frontières n'ont pas pu être chargées."));

/* ── PANNEAU / BOTTOM SHEET ── */
const SH=["peek","half","full"];
function setSheet(s){S.sheet=s;$("panel").dataset.sheet=s;}
const sheetPx=()=>({peek:176,half:innerHeight*.52,full:innerHeight*.5})[S.sheet];
function pad(){
  return mobile()?{paddingTopLeft:[16,70],paddingBottomRight:[16,sheetPx()+16]}
                 :{paddingTopLeft:[$("panel").offsetWidth+36,24],paddingBottomRight:[64,24]};
}
function fit(list,fresh){
  if(!list.length)return;
  const b=L.latLngBounds(list.map(p=>[p.lat,p.lon]));
  map.fitBounds(b,{...pad(),maxZoom:list.length===1?Math.min(Math.max(map.getZoom(),10),13):9,animate:!fresh});
}
let y0=null;
const grab=$("grab");
grab.addEventListener("pointerdown",e=>{y0=e.clientY;grab.setPointerCapture(e.pointerId);});
grab.addEventListener("pointerup",e=>{
  if(y0===null)return;const dy=e.clientY-y0;y0=null;let i=SH.indexOf(S.sheet);
  if(Math.abs(dy)<8)i=S.sheet==="peek"?1:S.sheet==="half"?0:1;
  else i=dy<0?Math.min(2,i+1):Math.max(0,i-1);
  setSheet(SH[i]);
});
$("q").addEventListener("focus",()=>{if(mobile())setSheet("full");});

/* ── FILTRES ── */
function buildChips(){
  let h=`<button class="chip" data-k="co" data-v="all">🌍 Tous <small id="n-all"></small></button>`;
  ORDER.filter(c=>D.some(p=>p.co===c)).forEach(c=>h+=`<button class="chip" data-k="co" data-v="${c}"><span class="fi fi-${c.toLowerCase()}"></span>${CN[c]} <small data-n="${c}"></small></button>`);
  $("chips").innerHTML=h;
  $("tray").innerHTML=`<h4>Type de pépinière</h4><div>${TYPES.map(t=>`<button class="chip" data-k="type" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>
    <h4>Livraison</h4><div>${LIVS.map(t=>`<button class="chip" data-k="liv" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>
    <div style="margin-top:10px"><button class="link" id="reset">↺ Tout réinitialiser</button></div>`;
}
function onChip(e){
  const b=e.target.closest("[data-k]");if(!b)return;
  const{k,v}=b.dataset;
  if(k==="co")S.co=v;else if(k==="type")S.types.has(v)?S.types.delete(v):S.types.add(v);else S.liv=S.liv===v?null:v;
  render(true);
}
$("chips").addEventListener("click",onChip);$("tray").addEventListener("click",e=>{
  if(e.target.id==="reset"){S.co="all";S.types.clear();S.liv=null;S.q="";$("q").value="";render(true);}else onChip(e);});
$("fbtn").onclick=()=>{const o=$("tray").classList.toggle("open");$("fbtn").setAttribute("aria-expanded",o);};
let qt;$("q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=norm(e.target.value.trim());render(true);},180);});

/* ── RENDU ── */
function render(refit){
  const f=D.filter(p=>matches(p));
  if(S.user){f.forEach(p=>p._d=dist(S.user,p));f.sort((a,b)=>a._d-b._d);}
  layer.clearLayers();
  f.forEach(p=>layer.addLayer(MK[p.id]));
  if(S.sel&&!f.includes(byId[S.sel]))layer.addLayer(MK[S.sel]);
  const nP=new Set(f.map(p=>p.co)).size;
  $("count").innerHTML=`<b>${f.length}</b> pépinière${f.length>1?"s":""} · ${nP} pays`;
  $("unsort").hidden=!S.user;
  const nf=S.types.size+(S.liv?1:0);$("fn").textContent=nf;$("fbtn").classList.toggle("has",nf>0);
  document.querySelectorAll("#panel [data-k]").forEach(b=>{const{k,v}=b.dataset;b.classList.toggle("on",k==="co"?S.co===v:k==="type"?S.types.has(v):S.liv===v);});
  $("n-all").textContent=D.filter(p=>matches(p,true)).length;
  document.querySelectorAll("[data-n]").forEach(n=>n.textContent=D.filter(p=>p.co===n.dataset.n&&matches(p,true)).length);
  const row=p=>{
    const tg=[`<span class="tag ${PV[p.pv][0]}">${PV[p.pv][1]}</span>`].concat(p.tags.filter(t=>TAGS[t]&&t!=="online"&&t!=="local").slice(0,2).map(t=>`<span class="tag ${TAGS[t][0]}">${TAGS[t][1]}</span>`));
    if(p.isNew)tg.push('<span class="tag t-new">✨ Nouveau</span>');
    return `<div class="row${S.sel===p.id?" act":""}" data-id="${p.id}" tabindex="0" role="button">
      <span class="fl"><span class="fi fi-${esc(p.fc)}"></span></span>
      <div class="rb"><div class="rn">${esc(p.name)}</div><div class="rl">${esc(p.loc.split(",").slice(-2).join(",").trim())}</div><div class="tags">${tg.join("")}</div></div>
      ${S.user?`<span class="rd">${km(p._d)}</span>`:'<svg class="rc" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}</div>`;};
  let h="";
  if(S.user)h=f.map(row).join("");
  else ORDER.forEach(c=>{const g=f.filter(p=>p.co===c);if(g.length)h+=`<div class="gh"><span class="fi fi-${c.toLowerCase()}"></span><span>${CN[c]}</span><span>${g.length}</span></div>`+g.map(row).join("");});
  $("list").innerHTML=h||`<div class="empty"><b>🔍</b>Aucune pépinière ne correspond.<br><button class="link" onclick="document.getElementById('reset').click()">Réinitialiser les filtres</button></div>`;
  if(refit&&f.length)fit(f);
}
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openDetail(+r.dataset.id);});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const r=e.target.closest(".row");if(r){e.preventDefault();openDetail(+r.dataset.id);}}});

/* ── FICHE ── */
let listScroll=0;
function setSel(id){
  if(S.sel&&MK[S.sel]){MK[S.sel].setIcon(icon(byId[S.sel],false));MK[S.sel].setZIndexOffset(0);}
  S.sel=id;
  if(id){if(!layer.hasLayer(MK[id]))layer.addLayer(MK[id]);MK[id].setIcon(icon(byId[id],true));MK[id].setZIndexOffset(1000);}
}
function openDetail(id,push=true){
  const p=byId[id];if(!p)return;
  if($("panel").dataset.view==="list")listScroll=$("pb").scrollTop;
  setSel(id);
  const acts=[];
  if(p.site)acts.push(`<a class="ac pri" href="${esc(p.site)}" target="_blank" rel="noopener">🌐 Visiter le site</a>`);
  if(p.tel)acts.push(`<a class="ac" href="tel:${esc(p.tel.replace(/[^+\d]/g,""))}">📞 Appeler</a>`);
  if(p.email)acts.push(`<a class="ac" href="mailto:${esc(p.email)}">✉️ Écrire</a>`);
  acts.push(`<a class="ac" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}" target="_blank" rel="noopener">🧭 Itinéraire</a>`);
  const tg=[`<span class="tag ${PV[p.pv][0]}">${PV[p.pv][1]}</span>`].concat(p.tags.filter(t=>TAGS[t]).map(t=>`<span class="tag ${TAGS[t][0]}">${TAGS[t][1]}</span>`));
  if(p.isNew)tg.push('<span class="tag t-new">✨ Nouveau</span>');
  const ce=(p.certifs||[]).filter(c=>CERTS[c]).map(c=>`<div>${CERTS[c]}</div>`).join("");
  const cells=[["Vente",p.vente],["Note clients",p.note],["Statut",PV[p.pv][1]],["Pays",CN[p.co]]];
  if(S.user)cells.push(["Distance",km(dist(S.user,p))]);
  const ct=[p.tel&&`📞 <a href="tel:${esc(p.tel.replace(/[^+\d]/g,""))}">${esc(p.tel)}</a>`,p.email&&`✉️ <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`].filter(Boolean).join("<br>");
  $("detail").innerHTML=`<div class="dtop"><button class="ibtn" id="back">← Retour</button><button class="ibtn" id="share">↗ Partager</button></div>
    <div class="dh"><div class="dc"><span class="fl"><span class="fi fi-${esc(p.fc)}"></span></span>${esc(CN[p.co]||p.co)}</div>
    <h2 class="dn">${esc(p.name)}</h2><div class="dl">📍 ${esc(p.loc)}</div><div class="tags">${tg.join("")}</div></div>
    <div class="acts">${acts.join("")}</div>
    <div class="dd">${esc(p.spec)}</div>${ce?`<div class="cert">${ce}</div>`:""}
    <div class="grid">${cells.map(([l,v])=>`<div class="cell"><small>${l}</small><span>${esc(v||"—")}</span></div>`).join("")}</div>
    ${ct?`<div class="ct">${ct}</div>`:""}`;
  $("panel").dataset.view="detail";$("pb").scrollTop=0;
  $("back").onclick=()=>closeDetail();
  $("share").onclick=async()=>{const u=location.href.split("#")[0]+"#"+id;
    try{if(navigator.share)await navigator.share({title:p.name+" — La Route des Agrumes",url:u});else{await navigator.clipboard.writeText(u);toast("Lien copié 👍");}}catch(e){}};
  if(mobile()&&S.sheet!=="full")setSheet("half");
  if(push)history.replaceState(null,"","#"+id);
  map.fitBounds(L.latLngBounds([[p.lat,p.lon]]),{...pad(),maxZoom:Math.min(Math.max(map.getZoom(),10),13)});
  render();
}
function closeDetail(){
  setSel(null);$("panel").dataset.view="list";
  history.replaceState(null,"",location.pathname+location.search);
  render();$("pb").scrollTop=listScroll;
}
addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sel)closeDetail();});
addEventListener("hashchange",()=>{const id=+location.hash.slice(1);if(id&&byId[id]&&id!==S.sel)openDetail(id,false);else if(!location.hash&&S.sel)closeDetail();});
map.on("click",()=>{if(mobile()&&S.sheet==="full")setSheet("half");});

/* ── GÉOLOCALISATION ── */
let me;
$("geo").onclick=()=>{
  if(!navigator.geolocation)return toast("Géolocalisation indisponible sur cet appareil.");
  toast("Localisation en cours…");
  navigator.geolocation.getCurrentPosition(pos=>{
    S.user={lat:pos.coords.latitude,lon:pos.coords.longitude};
    if(me)me.remove();
    me=L.circleMarker([S.user.lat,S.user.lon],{radius:8,color:"#fff",weight:3,fillColor:"#38bdf8",fillOpacity:1}).addTo(map);
    if($("panel").dataset.view==="detail")closeDetail();
    render();$("pb").scrollTop=0;
    const near=D.map(p=>[dist(S.user,p),p]).sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>x[1]);
    fit(near.concat({lat:S.user.lat,lon:S.user.lon}));
    toast("Pépinières triées de la plus proche à la plus lointaine");
  },()=>toast("Localisation refusée ou indisponible."),{timeout:9000});
};
$("unsort").onclick=()=>{S.user=null;if(me){me.remove();me=null;}render(true);};

/* ── DÉMARRAGE ── */
buildChips();render();
fit(D,true);
{const id=+location.hash.slice(1);if(id&&byId[id])openDetail(id,false);}
</script>
</body>
</html>
